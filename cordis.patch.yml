# @cloudplugin/dsh-skill-creator — bundle patch (inserted rows)
# All in-process; there is no child engine and no listening port:
#   Host  : registers the official creator skills (ctx.skills.registerProvider) and the
#           panel API (ctx.webServer), and runs the creation flow by driving an agent
#           (ctx.agents.create + agent.followup + agent/assistant-stream observation).
#   Client: the run console rendered as its own centre panel (main keyed slot
#           "skill-creator") reached from a sidebar.panellist icon — NOT in
#           conversation.composer.dock, which is only "ambient entries below the
#           composer card". (browser module id = package name, dsh.client.platform=web)
- insert:
    - id: dsh-skill-creator
      name: '@cloudplugin/dsh-skill-creator'
      config:
        # Creator delegation: the two official creators are fetched from these repos and
        # registered as loadable skills. Cache/TTL via env
        # (DSH_SKILL_CREATOR_CACHE / DSH_SKILL_CREATOR_TTL_MS).
        creators:
          huawei:
            repo: 'https://gitcode.com/huaweicloud/huaweicloud-skills.git'
            branch: 'master'
            path: 'skills/devtools/common/huawei-cloud-skill-creator'
          generic:
            repo: 'https://gitcode.com/grape-dev/grape-skills.git'
            branch: 'main'
            path: 'skills/coding/scaffolding/common-skill-creator'
        # Live taxonomy for the 一级/二级/三级 dropdowns (gitcode contents API).
        catalog:
          repo: 'huaweicloud/huaweicloud-skills'
          ref: 'master'
          root: 'skills'
          localDir: ''           # optional local clone; used only when the API fails
          ttlMs: 600000          # per-path cache TTL (the API rate-limits bursts)
        # Creation run: omit agentOptions to use the profile's default model selection.
        #
        # NO machine-specific values ship here. Both keys below are deliberately absent:
        #  · cwd           — absent → the DSH host process cwd (verified on this build:
        #                    the PROFILE dir, e.g. ~/.dsh/profiles/desktop), and the creator
        #                    writes <cwd>/skills/<domain>/<product>/<name>. Set it to the
        #                    workspace that should receive the skill.
        #  · permissionPreset — absent → the deployment/session default preset is kept; the
        #                    run never forces a permissive sandbox on someone else's machine.
        # A creator MUST run bash (ensure_cli.sh / validate-skill.sh), which cannot fork
        # inside a read-only/workspace-write sandbox, so an unattended run may stall on the
        # escalation prompt. Opt in explicitly, understanding that:
        run:
          # cwd: '/absolute/path/to/your/workspace'
          # The creator pipelines run bash/CLI scripts; without full access they are blocked at
          # the approval wall and the run dies on the idle watchdog. Ship it open, and document it.
          permissionPreset: 'danger-full-access'
          # agentPreset: 'standard'
          # ── 技能评测（skill-verify-leader 口径，本地 10 分制）──────────────
          # 通过线：10 分制 ≥ 8.5（即"85 分"）。稳定性 4 + 成本 1 + 效率 2 + 安全 3。
          passScore: 8.5
          # 最多 3 轮：每轮 = 一次评测（真跑只读用例）。0 = 关闭评测（只创建）。
          # 到顶仍未达标 → status='below-threshold' 并交报告，不继续硬跑。
          maxEvalRounds: 3
          # 评测只跑 templates/test-vars.json 里 type=readonly|syntax 的用例，
          # 写操作一律不跑（false 才放开，不建议）。
          evalReadonlyOnly: true
          # ── 成本/效率的绝对上限（首轮不再白送）────────────────────────────
          # 平台分数是"相对数据库基线 + 外部门禁"；本地面板两者都没有，照搬公式会让
          # 首轮的成本(1)+效率(2) 恒为满分（实测三次运行都是 10.00/10，8.5 通过线形同虚设）。
          # 现在始终按绝对上限判定；有基线时"≤ 基线×(1+10%)"与"≤ 绝对上限"同时成立才满分。
          # 默认值依据实测量级：评测轮 token 23965/28550/38999/39617、时长
          # 42.5/58.2/65.75/394.1 s、工具调用 4-8、cli 2-6、llm 4-6、工具失败 0、重试 0。
          evalTokenBudget: 50000          # 单轮 token 上限（input+output）
          evalDurationCapSeconds: 600     # 单轮墙钟时长上限（秒）
          evalMaxToolCalls: 20            # 单轮工具调用总量上限（cli/sdk/api 分类项共享该上限）
          evalMaxLlmCalls: 20             # 单轮 LLM（assistant）轮次上限
          evalMaxCliCalls: 20             # cli / sdk / api 分类调用次数上限
          evalMaxSdkCalls: 20
          evalMaxApiCalls: 20
          evalMaxToolFailures: 0          # 工具失败必须为 0（绝对要求，不受容差保护）
          evalMaxRetries: 0               # 重试必须为 0（绝对要求，不受容差保护）
          # ── 夹具证据（功能可用 3 分的唯一依据）与本地门禁 ────────────────
          # 评测 agent 自编的用例不能支撑「功能可用」：必须真实执行 skill 自带夹具
          # （huawei/api: templates/test-vars.json；generic: evals/evals.json）至少这么多条，
          # 每条带执行命令 + 观测结果 + 与期望的对比结论，且没有 fail。
          minFixtureCases: 3
          # 任一本地门禁不过（SKILL.md/frontmatter、该 kind 的夹具、结构校验 error、
          # 华为云 creator 的 validate-skill.sh）→ 总分压到该上限，确保 verdict 非 pass。
          gateScoreCap: 7.0
          # true = 把华为云仓库的结构规则逐条套到所有 kind（api 的 requirements.txt、
          # generic 的 evals/ 会被判成 error）。默认 false：按 kind 取规则。
          strictStructureGate: false
          # 静默阈值（无任何活动才判死）与整段绝对兜底
          idleTimeoutMs: 480000
          phaseTimeoutMs: 7200000
          # 等待「工具调用返回」的专用上限（默认 20 分钟）。工具在飞的时候 agent 完全不产生
          # assistant 帧：`job_output wait=true timeout_ms=600000` 就是 10 分钟合法静默，旧规则
          # 按 idleTimeoutMs(8 分钟) 把它当卡死、杀掉健康的 run。有此键后，"既没有待决工具、
          # 也没有新帧"才算静默；超时才判死并报「等待工具 <名> 返回超时」。
          toolWaitMs: 1200000
